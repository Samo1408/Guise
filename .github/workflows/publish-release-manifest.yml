name: Publish release manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Guise release tag to publish (for example v2.0.0-beta.4)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-manifest
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Generate verified manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          version_code="$(sed -n 's/^versionCode=//p' app/version.properties | tr -d '\r')"
          version_name="$(sed -n 's/^versionName=//p' app/version.properties | tr -d '\r')"
          expected_tag="v${version_name}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Skipping historical release ${RELEASE_TAG}; current manifest tag is ${expected_tag}"
            echo "SKIP_MANIFEST=true" >> "${GITHUB_ENV}"
            exit 0
          fi

          asset_name="Guise-${version_name}.apk"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset_name}" \
            --dir "${RUNNER_TEMP}"
          apk_path="${RUNNER_TEMP}/${asset_name}"
          test -s "${apk_path}"
          apk_sha256="$(sha256sum "${apk_path}" | awk '{print $1}')"

          official_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
          xget_url="https://xget.xi-xu.me/gh/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          is_prerelease="$(jq -r '.prerelease' <<<"${release_json}")"
          if [[ "${is_prerelease}" == "true" ]]; then
            manifest_name="latest-prerelease.json"
          else
            manifest_name="latest-release.json"
          fi
          echo "MANIFEST_NAME=${manifest_name}" >> "${GITHUB_ENV}"
          release_title="$(jq -r '.name // empty' <<<"${release_json}")"
          release_notes="$(jq -r '.body // empty' <<<"${release_json}")"
          jq -n \
            --argjson versionCode "${version_code}" \
            --argjson prerelease "${is_prerelease}" \
            --arg versionName "${version_name}" \
            --arg title "${release_title:-Guise Reborn ${version_name}}" \
            --arg notes "${release_notes}" \
            --arg releaseUrl "${release_url}" \
            --arg cdnPrimary "https://gh-proxy.com/${official_url}" \
            --arg cdnSecondary "https://ghfast.top/${official_url}" \
            --arg cdnThird "https://ghproxy.net/${official_url}" \
            --arg cdnFourth "https://ghproxy.vip/${official_url}?sha=${apk_sha256}" \
            --arg cdnFifth "https://gh.jasonzeng.dev/${official_url}" \
            --arg cdnSixth "https://gh.3w.pm/${official_url}" \
            --arg cdnSeventh "https://v6.gh-proxy.com/${official_url}" \
            --arg cdnEighth "https://v6.gh-proxy.org/${official_url}" \
            --arg cdnNinth "https://gh-proxy.org/${official_url}" \
            --arg cdnTenth "${xget_url}" \
            --arg apkUrl "${official_url}" \
            --arg apkSha256 "${apk_sha256}" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              prerelease: $prerelease,
              title: $title,
              notes: $notes,
              releaseUrl: $releaseUrl,
              apkUrls: [
                $cdnPrimary,
                $cdnSecondary,
                $cdnThird,
                $cdnFourth,
                $cdnFifth,
                $cdnSixth,
                $cdnSeventh,
                $cdnEighth,
                $cdnNinth,
                $cdnTenth,
                $apkUrl
              ],
              apkUrl: $apkUrl,
              apkSha256: $apkSha256
            }' > "${manifest_name}"

          manifest_paths="${manifest_name}"
          # Clients published before the split only know latest-release.json. Keep that upgrade
          # path alive until a real stable manifest exists. New stable clients validate the
          # prerelease field and therefore reject this compatibility alias.
          if [[ "${is_prerelease}" == "true" ]] && \
             { [[ ! -f latest-release.json ]] || jq -e '.prerelease == true' latest-release.json >/dev/null; }; then
            cp "${manifest_name}" latest-release.json
            manifest_paths="${manifest_paths} latest-release.json"
          fi
          echo "MANIFEST_PATHS=${manifest_paths}" >> "${GITHUB_ENV}"

      - name: Commit manifest to main
        if: env.SKIP_MANIFEST != 'true'
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra manifest_paths <<< "${MANIFEST_PATHS}"
          if [[ -z "$(git status --porcelain -- "${manifest_paths[@]}")" ]]; then
            echo "${MANIFEST_PATHS} is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${manifest_paths[@]}"
          git commit -m "Publish ${RELEASE_TAG} update manifest"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Purge mutable jsDelivr cache
        if: env.SKIP_MANIFEST != 'true'
        shell: bash
        run: |
          read -ra manifest_paths <<< "${MANIFEST_PATHS}"
          for manifest_path in "${manifest_paths[@]}"; do
            purge_url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${manifest_path}"
            if ! curl --fail --silent --show-error --retry 3 "${purge_url}"; then
              echo "::warning::Could not purge ${manifest_path} from jsDelivr; GitHub API remains authoritative"
            fi
          done
