name: Update download statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  release:
    types: [published, deleted]

permissions:
  contents: write

concurrency:
  group: update-download-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Collect all APK download counts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${RUNNER_TEMP}/release-pages.json"
          python3 .github/scripts/update_download_stats.py \
            --releases-json "${RUNNER_TEMP}/release-pages.json" \
            --readme README.md

      - name: Commit updated statistics
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "Download statistics are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update release download statistics"
          git pull --rebase origin main
          git push origin HEAD:main
