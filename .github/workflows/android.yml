name: Android CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: ./gradlew assembleRelease lintRelease

      - name: Upload Guise To Artifacts
        uses: actions/upload-artifact@v4
        with:
         name: Guise-app-release
         path: app/build/outputs/apk/release/app-release.apk
